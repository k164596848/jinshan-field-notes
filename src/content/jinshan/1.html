<header class="place-intro"><p class="eyebrow">01 / FIND JINSHAN</p><h2>在山與海之間，找到金山。</h2><p>先從地圖認識這個小鎮，再看海岸、山脈與土地，如何交織出金山的風景。</p></header>
<div class="place-facts"><section class="place-fact"><span class="place-fact-index" aria-hidden="true">海</span><h3>東北，面向東海</h3><p>金山位於台灣北海岸。</p></section><section class="place-fact"><span class="place-fact-index" aria-hidden="true">山</span><h3>背靠大屯山群</h3><p>火山地形，也帶來溫泉與硫磺。</p></section><section class="place-fact"><span class="place-fact-index" aria-hidden="true">鄰</span><h3>串起北海岸</h3><p>鄰近萬里、石門與三芝等地。</p></section></div><section class="place-copy"><h2>從台灣北端，讀進金山。</h2><p>金山區位於台灣北海岸，東北臨東海，西南鄰台北市北投區與士林區，東南接萬里區，西北接石門區與三芝區，交通四通八達。鄰近景點眾多，是北海岸風景區的精華地段；境內以大屯火山群的溫泉區為主，又因大屯山出產硫磺，古書多以「採硫之地」形容金包里一帶。這些條件讓金山成為著名的觀光景點。</p></section><div class="place-map-grid"><figure class="travel-figure map-figure"><a href="photo/Jinshan1-1_p/taiwan.jpg" class="zoom"><img src="photo/Jinshan1-1_p/taiwan.jpg" alt="原專題地圖：台灣與金山的地理位置" width="372" height="526" loading="lazy"></a><figcaption><span class="figure-label">01 / 台灣北海岸</span>由全島視角，找到金山所在的位置。</figcaption></figure><figure class="travel-figure map-figure"><a href="photo/Jinshan1-1_p/j-map.png" class="zoom"><img src="photo/Jinshan1-1_p/j-map.png" alt="原專題行政區位置圖，以黃色標示金山及鄰近地區" width="298" height="302" loading="lazy"></a><figcaption><span class="figure-label">02 / 金山與周邊</span>把視線拉近，認識金山與鄰近地區。</figcaption></figure></div>
